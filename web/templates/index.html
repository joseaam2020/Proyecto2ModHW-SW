<!-- Figma design faithfully translated to HTML. Images are hotlinked from Figma and may expire. -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinProd</title>
    <link rel="stylesheet" href="/static/index.css" />
    <script src="/static/index.js" defer></script>
  </head>
  <body>
    <div class="outer-frame">
      <div class="app-frame">
        <div class="app-left">
          <div class="left-autolayout">
            <div class="home-frame">
              <img
                  src="/static/imgs/Home.svg"
                alt="Home Icon"
              />
              <span>LinProd</span>
            </div>
            <div class="config-card">
              <div class="config-section">
                <div class="config-title">
                  <img
                    src="/static/imgs/ConfigIcon.svg"
                    alt="Config Icon"
                  />
                  <span>Configuración</span>
                </div>
                <div class="config-row">
                  <span>Cantidad de productos</span>
                  <input class="config-input" type="number" min="0" step="1" />
                </div>
                <div class="add-process-section">
                  <div class="add-process-label">Añadir procesos</div>
                  <button class="add-process-btn">
                    <img
                      src="/static/imgs/BlueCross.svg"
                      alt="Añadir"
                    />
                  </button>
                  <script>
                    // Attach click handler to the add-process-btn
                    document.addEventListener("DOMContentLoaded", function () {
                      const btn = document.querySelector(".add-process-btn");
                      if (btn) btn.onclick = addProcessFigma;
                    });
                  </script>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="app-right">
          <div class="right-top">
            <span class="linea-label">Línea de Producción</span>
            <div>
              <div class="execution-time-section">
                <span class="execution-time-label">Tiempo de Ejecución</span>
                <input class="execution-time-input" type="number" min="0" step="1" />
                <span class="units-label">ms</span>
              </div>
              <div class="controls-section">
                <div>
                  <span class="tick-label">Reloj: </span>
                  <input class="tick-input" type="number" min="0" step="1" value="0" readonly />
                </div>
                <div>
                  <button class="control-buttons" id="previous-btn">⏪︎</button>
                  <button class="control-buttons" id="iniciar-btn">▶</button>
                  <button class="control-buttons" id="next-btn">⏩︎︎</button>
                </div>
              </div>
            </div>
          </div>
          <div class="right-bottom" id="right-bottom-process-list">
            <!-- Process cards will be rendered here by JS -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
